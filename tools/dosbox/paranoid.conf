# DOSBox-X settings for running the original PARANOID v1.8 as a reference.
# Used by tools/run_original.sh; see TODO.md Part 0.

[sdl]
output = surface
autolock = false

[dosbox]
# S3 VGA: mode 0x10 (640x350x16) runs at 70 Hz, the tick rate the remake
# matches. machine=ega would run at 60 Hz.
machine = svga_s3
memsize = 16
fastbioslogo = true
startbanner = false

[render]
# Keep screenshots at the raw 640x350.
aspect = false
scaler = none

[cpu]
core = normal
cputype = 386
# The game waits for vertical retrace every tick, so speed only has to be
# high enough never to miss a frame; it does not change the game logic.
cycles = fixed 30000

[speaker]
pcspeaker = true

[dos]
keyboardlayout = us
